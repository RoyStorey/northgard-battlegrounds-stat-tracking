[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbg-tracker"
version = "0.1.0"
description = "Records your Northgard Battlegrounds runs and shows which structures, cards and strategies win for you."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "numpy>=1.26", "pillow>=10", "opencv-python>=4.8", "rapidocr_onnxruntime>=1.2", "mss>=9; sys_platform == 'win32'"]

[project.optional-dependencies]
tray = ["pystray>=0.19"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
nbg-tracker = "nbg_tracker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nbg_tracker = ["web/*", "known_ids.json"]
